  # API Quick Reference
  
  > Cheat sheet for the Tradu Test Automation Framework APIs.
  
  ## Table of Contents
  
  - [WebDriver API](#webdriver-api)
  - [Element API](#element-api)
  - [Locator Strategies](#locator-strategies)

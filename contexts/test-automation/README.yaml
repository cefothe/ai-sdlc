  # Test Automation Framework Context

  > **Purpose**: Comprehensive documentation for Claude Code agents to write automated tests using the `tradu-test-automation-framework` without accessing the framework's source code.

  ## 📋 Table of Contents

  - [Overview](#overview)
  - [Quick Start](#quick-start)
  - [Documentation Structure](#documentation-structure)
  - [For Claude Code Agents](#for-claude-code-agents)
  - [Framework Version](#framework-version)
  - [Contributing](#contributing)

  ## Overview

  This directory contains comprehensive context documentation for the **Tradu Test Automation Framework** - an enterprise-grade, hexagonal-architecture test automation framework supporting:

  - ✅ **Web Testing** (Playwright adapter)
  - ✅ **API Testing** (REST/HTTP, WebSocket, FIX Protocol)
  - ⚠️ **Mobile Testing** (Architecture ready, implementation pending)
  - ✅ **Reporting** (Allure, XRay, Teams)
  - ✅ **Parallel Execution** (ThreadLocal driver management)
  - ✅ **Configuration Management** (Environment profiles)

  ## Quick Start

  ### For Claude Code Agents

  1. **Start with the master context**: Read `FRAMEWORK_CONTEXT.yaml` first
  2. **Choose your testing type**:
     - Web UI tests → `guides/WEB_AUTOMATION_GUIDE.yaml`
     - API tests → `guides/API_TESTING_GUIDE.yaml`
  3. **Learn patterns**: Read `guides/TEST_PATTERNS.yaml`
  4. **Configure**: See `guides/CONFIGURATION_GUIDE.yaml`
  5. **Quick lookup**: Use `reference/API_QUICK_REFERENCE.yaml`

  ### For Project Setup

  1. Copy `templates/PROJECT_CONTEXT_TEMPLATE.yaml` to your project's `.claude/` directory
  2. Fill in project-specific details (URLs, test users, domain knowledge)
  3. Reference both framework and project contexts in your agents

  ## Documentation Structure

  ```
  ~/.claude/contexts/test-automation/
  ├── README.yaml                           ← You are here
  ├── FRAMEWORK_CONTEXT.yaml                ← START HERE - Master context
  ├── guides/
  │   ├── WEB_AUTOMATION_GUIDE.yaml         ← Web testing (Playwright)
  │   ├── API_TESTING_GUIDE.yaml            ← REST/WebSocket/FIX
  │   ├── TEST_PATTERNS.yaml                ← Page Objects, Services
  │   ├── CONFIGURATION_GUIDE.yaml          ← Environment config
  │   └── REPORTING_GUIDE.yaml              ← Allure, XRay, Teams
  ├── reference/
  │   └── API_QUICK_REFERENCE.yaml          ← Cheat sheet
  └── templates/
      └── PROJECT_CONTEXT_TEMPLATE.yaml     ← Project template
  ```

  ### File Descriptions

  | File | Purpose | Size | Use When |
  |------|---------|------|----------|
  | **FRAMEWORK_CONTEXT.yaml** | Complete architecture overview, capabilities, technology stack | ~3000 lines | Starting a new project or understanding framework |
  | **WEB_AUTOMATION_GUIDE.yaml** | WebDriver API, locators, Page Objects, driver management | ~2000 lines | Writing web UI tests |
  | **API_TESTING_GUIDE.yaml** | REST/HTTP, WebSocket, FIX protocol testing | ~1500 lines | Writing API tests |
  | **TEST_PATTERNS.yaml** | BaseTest, Page Objects, Services, test data models | ~1500 lines | Structuring test code |
  | **CONFIGURATION_GUIDE.yaml** | Environment profiles, properties reference | ~800 lines | Configuring test environments |
  | **REPORTING_GUIDE.yaml** | Allure, XRay, Teams integration | ~800 lines | Setting up reporting |
  | **API_QUICK_REFERENCE.yaml** | Cheat sheet with all APIs | ~1000 lines | Quick lookups during coding |
  | **PROJECT_CONTEXT_TEMPLATE.yaml** | Template for project-specific context | ~500 lines | Setting up project context |

  ## For Claude Code Agents

  ### How to Reference These Contexts

  #### Option 1: In Agent YAML Configuration

  ```yaml
  # ~/.claude/agents/qa-functional-engineer.yaml
  name: qa-functional-engineer
  context:
    - ~/.claude/contexts/test-automation/FRAMEWORK_CONTEXT.yaml
    - ~/.claude/contexts/test-automation/guides/WEB_AUTOMATION_GUIDE.yaml
    - ~/.claude/contexts/test-automation/guides/TEST_PATTERNS.yaml
    - .claude/PROJECT_TEST_CONTEXT.yaml  # Project-specific
  instructions: |
    You are a QA automation engineer specializing in functional testing.
    Use the test automation framework documented in the context files.

    Your responsibilities:
    - Write complete, production-ready test cases
    - Follow Page Object Model patterns
    - Use appropriate locator strategies
    - Ensure proper error handling
    - Add Allure and XRay annotations
  ```

  #### Option 2: Direct Reference in Prompts

  ```markdown
  You are a QA engineer writing automated tests.

  Context files:
  @~/.claude/contexts/test-automation/FRAMEWORK_CONTEXT.yaml
  @~/.claude/contexts/test-automation/guides/WEB_AUTOMATION_GUIDE.yaml
  @.claude/PROJECT_TEST_CONTEXT.yaml

  Task: Create a complete end-to-end test for user login flow.
  ```

  ### Example Agent Configurations

  #### 1. Functional Test Engineer
  ```yaml
  name: qa-functional-engineer
  context:
    - FRAMEWORK_CONTEXT.yaml
    - guides/WEB_AUTOMATION_GUIDE.yaml
    - guides/TEST_PATTERNS.yaml
  specialization: End-to-end functional tests, UI workflows
  ```

  #### 2. API Test Engineer
  ```yaml
  name: qa-api-engineer
  context:
    - FRAMEWORK_CONTEXT.yaml
    - guides/API_TESTING_GUIDE.yaml
    - guides/TEST_PATTERNS.yaml
  specialization: REST/WebSocket/FIX protocol testing
  ```

  #### 3. Page Object Engineer
  ```yaml
  name: qa-page-object-engineer
  context:
    - FRAMEWORK_CONTEXT.yaml
    - guides/WEB_AUTOMATION_GUIDE.yaml
    - guides/TEST_PATTERNS.yaml
  specialization: Page Object Model implementation
  ```

  #### 4. Test Code Reviewer
  ```yaml
  name: qa-code-reviewer
  context:
    - FRAMEWORK_CONTEXT.yaml
    - guides/TEST_PATTERNS.yaml
    - reference/API_QUICK_REFERENCE.yaml
  specialization: Code quality, patterns, best practices
  ```

  ### Agent Success Criteria

  A properly configured agent using these contexts should be able to:

  1. ✅ Write complete web UI tests without accessing framework source code
  2. ✅ Write REST/WebSocket/FIX API tests without accessing framework source
  3. ✅ Create Page Objects following framework patterns
  4. ✅ Create Service classes following framework patterns
  5. ✅ Configure test environments correctly
  6. ✅ Integrate Allure and XRay reporting
  7. ✅ Choose appropriate locator strategies
  8. ✅ Handle test data with proper patterns
  9. ✅ Debug test failures using framework features
  10. ✅ Extend framework for project-specific needs


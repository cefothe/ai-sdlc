  ## Philosophy

  ### Why These Contexts Exist

  **Problem**: Claude Code agents need to write tests but shouldn't have access to framework internals.

  **Solution**: Comprehensive documentation of the framework's **public API and patterns** so agents can:
  - Understand what the framework provides
  - Use it correctly without seeing implementation
  - Follow established patterns and best practices
  - Produce production-ready test code

  ### Design Principles

  1. **Complete**: Every public API method is documented
  2. **Practical**: Real-world examples, not toy examples
  3. **Clear**: No assumptions about prior knowledge
  4. **Maintainable**: Easy to update when framework changes
  5. **Discoverable**: Well-organized, easy to navigate

  ### What's NOT Included

  - Framework implementation details
  - Internal classes and methods
  - Build system specifics (Maven POM structure)
  - Framework development guide
  - How to extend framework adapters

  **Rationale**: Agents use the framework, they don't develop it. These docs focus on **usage, not implementation**.


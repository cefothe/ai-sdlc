  ## Examples

  ### Example 1: New Project Setup

  ```bash
  # 1. Copy project template
  cp ~/.claude/contexts/test-automation/templates/PROJECT_CONTEXT_TEMPLATE.yaml \
     my-project/.claude/PROJECT_TEST_CONTEXT.yaml

  # 2. Fill in project details
  # Edit my-project/.claude/PROJECT_TEST_CONTEXT.yaml

  # 3. Configure agent to use both framework and project contexts
  # Edit ~/.claude/agents/my-project-qa.yaml
  ```

  ### Example 2: Writing a Web Test

  ```markdown
  **Agent Prompt:**

  You are a QA engineer. Write a complete end-to-end test for the login flow.

  Context:
  @~/.claude/contexts/test-automation/FRAMEWORK_CONTEXT.yaml
  @~/.claude/contexts/test-automation/guides/WEB_AUTOMATION_GUIDE.yaml
  @~/.claude/contexts/test-automation/guides/TEST_PATTERNS.yaml
  @my-project/.claude/PROJECT_TEST_CONTEXT.yaml

  Requirements:
  - Use Page Object Model
  - Add Allure annotations
  - Link to XRay test case PROJ-123
  - Handle error scenarios
  ```

  ### Example 3: API Test

  ```markdown
  **Agent Prompt:**

  Write API tests for the order creation endpoint.

  Context:
  @~/.claude/contexts/test-automation/guides/API_TESTING_GUIDE.yaml
  @~/.claude/contexts/test-automation/guides/TEST_PATTERNS.yaml

  Requirements:
  - Test happy path and error cases
  - Use Service class pattern
  - Verify response status and body
  - Add proper assertions
  ```


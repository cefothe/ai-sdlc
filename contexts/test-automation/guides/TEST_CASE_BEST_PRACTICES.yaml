  ## Test Case Template

  ```markdown
  ## Test Case: TC-{LEVEL}-{FEATURE}-{NUMBER}

  ### Name
  [Descriptive name encoding scenario and expected outcome]

  ### Test Level
  [Unit/Integration/E2E-API/E2E-UI/E2E-Performance/Microbenchmark]

  ### Priority
  [P0/P1/P2/P3 with justification]

  ### Test Type
  [Functional/Performance/Security/Compliance]

  ### Interface
  [Unit/Integration/BE-rest/BE-fix/BE-websocket/UI-web/UI-mobile]

  ### Preconditions
  - System state requirements
  - Data setup requirements
  - Configuration requirements
  - Service dependencies
  - Load configuration (performance tests)

  ### Test Data
  - Specific input values
  - Boundary values
  - Edge case values
  - Load parameters (performance tests)

  ### Test Steps
  1. Action with precise parameters
  2. Expected intermediate state
  3. Verification points
  4. Performance measurement points (performance tests)

  ### Expected Results
  - Functional correctness
  - Data integrity checks
  - Error handling behavior
  - Performance requirements (performance tests only)

  ### Postconditions
  - System state after test
  - Cleanup requirements
  - Audit trail verification

  ### Mocking Strategy (Integration Tests)
  - What is mocked and why
  - Real dependencies used
  ```


  ## Test Pyramid and Levels

  ### Distribution Strategy

  | Test Level | Coverage | Execution Speed | Purpose |
  |------------|----------|-----------------|---------|
  | Unit | 70% | <100ms | Business logic correctness |
  | Integration | 20% | <5s | Module interaction |
  | E2E API | 7% | <30s | Complete workflows via API |
  | E2E UI | 2% | <2min | Critical user journeys |
  | E2E Performance | 1% | <5min | User workflow performance |
  | Microbenchmarks | As needed | <1s | Component performance |

  ### Unit Tests

  **What to Cover**:
  - Pure business logic (calculations, validations, transformations)
  - Value objects (Price, Quantity, Money)
  - Utility functions (date/time, formatting, parsing)
  - Single-method validation
  - State transitions within single object
  - Edge cases and boundary values

  **Characteristics**:
  - Fast (milliseconds)
  - No external dependencies
  - High coverage (>95%)
  - Deterministic

  **Example Scenarios**:
  - Price conversion: decimal to fixed-point with boundary values (0.00001, 999999.99999)
  - Quantity validation: reject negative, zero, fractional (if not allowed)
  - Money calculations: addition, subtraction with overflow handling
  - Date parsing: valid formats, invalid formats, edge cases (leap years, time zones)

  ### Integration Tests

  **What to Cover**:
  - Service-to-service communication
  - Database operations (queries, transactions, constraints)
  - Message queue interactions
  - Protocol handlers
  - State persistence and recovery
  - Cross-module workflows

  **Characteristics**:
  - Use containerized dependencies (databases, message brokers)
  - Minimal mocking (only external third-party services)
  - Real configuration
  - Moderate execution time (seconds)
  - Realistic data flow

  **Example Scenarios**:
  - Order submission: REST API → OMS → Database persistence → Event stream publication
  - Position calculation: Multiple order executions → Position service aggregation
  - Snapshot recovery: Load snapshot → Replay events → Verify state consistency

  ### E2E API Tests

  **What to Cover**:
  - Complete business workflows through API
  - Multi-step processes across services
  - Data consistency across full stack
  - Error handling and recovery
  - Authentication and authorization
  - Rate limiting and throttling
  - Idempotency and retry logic

  **Characteristics**:
  - Hit actual API endpoints
  - Production-like environment
  - External client perspective
  - No UI involvement

  **Example Scenarios**:
  - Order lifecycle: Submit order (REST) → Monitor execution (WebSocket) → Verify position (REST)
  - Multi-protocol workflow: Submit via REST → Cancel via FIX → Verify via WebSocket
  - Error recovery: Submit with insufficient margin → Receive rejection → Verify no state change

  ### E2E UI Tests

  **What to Cover**:
  - Critical user journeys
  - Multi-page workflows
  - Visual feedback and real-time updates
  - Error messages and notifications
  - Cross-browser compatibility (if applicable)
  - Accessibility

  **Characteristics**:
  - Slowest tests
  - End-user perspective
  - Focus on happy paths and critical flows
  - Minimal coverage vs other levels

  **Example Scenarios**:
  - Trading journey: Login → Navigate to trading screen → Place order → Verify confirmation → Close position
  - Account management: Login → View positions → Check P&L → Logout
  - Error handling: Attempt invalid order → See error message → Correct and resubmit

  ### E2E Performance Tests

  **CRITICAL**: Test user workflows WITH performance assertions.

  **What to Cover**:
  - Same scenarios as E2E functional tests
  - User workflows: login, trading, reporting, account management
  - Real-world usage patterns under load
  - System behavior under sustained load
  - Performance degradation detection

  **Characteristics**:
  - Execute SAME workflows as E2E functional tests
  - Add performance assertions (latency percentiles, throughput)
  - Simulate realistic user load
  - Measure end-to-end response from user perspective

  **Example Scenarios**:
  - Trading workflow: Login → Place market order → Verify confirmation (measure p99 < 500ms)
  - Position monitoring: Login → View positions with 100 open positions (measure load time < 1s)
  - Concurrent trading: 1000 users simultaneously placing orders (measure system stability)

  ### Microbenchmark Tests

  **CRITICAL**: Test individual components, NOT user workflows.

  **What to Cover**:
  - Individual service components (risk check, matching engine)
  - Method-level performance (calculations, validations)
  - Algorithm efficiency (sorting, searching)
  - Memory allocation patterns
  - CPU-bound operations

  **Characteristics**:
  - Use microbenchmarking frameworks
  - Isolated component testing
  - Warm-up iterations
  - Statistical analysis
  - Sub-microsecond measurements

  **Example Scenarios**:
  - Risk check: Margin validation logic (target < 10μs)
  - Matching engine: Order book update (target < 5μs)
  - Price calculation: Bid/ask spread calculation (target < 1μs)
  - Serialization: Order message serialization (target < 2μs)

  ---

  ## HFT-Specific Considerations

  ### Latency Requirements

  **User Workflow Latency** (E2E Performance Tests):
  - p50 < 200ms (median response from user perspective)
  - p99 < 500ms
  - p99.9 < 1 second

  **Component Latency** (Microbenchmarks):
  - Risk check: p99 < 10μs
  - Matching engine: p99 < 5μs
  - Order validation: p99 < 2μs

  ### Throughput Requirements

  **System Capacity**:
  - Current: 300,000-500,000 orders/second
  - Target: 1,000,000 orders/second
  - Concurrent users: Up to 100,000 active connections

  ### Concurrency

  **Test Patterns**:
  - Simultaneous order modifications (same order ID)
  - Concurrent position updates (same account)
  - Atomic order book updates (lock-free verification)
  - Memory visibility (happens-before relationships)

  ### Data Integrity

  **Critical Validations**:
  - Order book consistency after every operation
  - Position calculations match sum of executions
  - Sequence number continuity (no gaps)
  - Audit trail completeness (100% event capture)

  ### Determinism

  **Requirements**:
  - Same input → same output (always)
  - Event replay produces identical state
  - Snapshot recovery reproduces exact state
  - No time-dependent behavior in business logic

  ### Clock Synchronization

  **Test Cases**:
  - Timestamp accuracy (±100μs per MiFID II)
  - NTP/PTP sync verification
  - Clock skew detection and handling
  - Leap second handling


  ## Quality Standards

  ### Coverage Requirements

  - Code coverage: ≥90% for critical paths
  - Branch coverage: ≥85%
  - Boundary value coverage: 100% for critical fields
  - Error path coverage: 100%

  ### Test Case Quality Metrics

  | Metric | Minimum Score | Evaluation |
  |--------|--------------|------------|
  | Clarity | 8/10 | Can new QA engineer understand and execute? |
  | Completeness | 8/10 | Are all edge cases covered? |
  | Maintainability | 7/10 | Resilient to minor system changes? |

  ### Execution Speed Targets

  | Test Level | Target Time |
  |------------|-------------|
  | Unit | <100ms per test |
  | Integration | <5 seconds per test |
  | E2E API | <30 seconds per test |
  | E2E UI | <2 minutes per test |
  | E2E Performance | <5 minutes per test |
  | Microbenchmark | <1 second per benchmark |


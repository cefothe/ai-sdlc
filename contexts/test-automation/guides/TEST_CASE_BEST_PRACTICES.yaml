  ## Integration Test Best Practices

  ### When to Use Containerized Dependencies

  - Database tests
  - Message broker tests
  - Cache layer tests
  - External service simulations

  ### What to Mock vs Use Real

  **Use Real (Containerized)**:
  - Databases (order persistence)
  - Message queues (event sourcing)
  - Cache layers (session management)
  - Internal services (OMS, Matching Engine, Risk Service)

  **Mock (Minimal)**:
  - External liquidity providers (unpredictable latency)
  - Third-party APIs (payment gateways, KYC)
  - External market data feeds (simulate realistic data)

  ### General Principles

  1. Prefer real dependencies over mocks
  2. Use containerized services mirroring production
  3. Mock only external and unpredictable services
  4. Ensure test isolation (proper setup/teardown)
  5. Validate data consistency across components


  ## Example Test Cases

  ### Example 1: Unit Test

  ```markdown
  ## Test Case: TC-UNIT-PRICE-001

  ### Name
  test_PriceConversion_MaximumValue_ConvertsCorrectly

  ### Test Level
  Unit

  ### Priority
  P1 - Critical value object used throughout system

  ### Test Type
  Functional

  ### Preconditions
  - Price value object class available

  ### Test Data
  - Input: "999999.99999" (maximum allowed price)
  - Expected internal representation: 99999999999 (fixed-point)

  ### Test Steps
  1. Create Price from decimal string "999999.99999"
  2. Verify internal fixed-point representation equals 99999999999
  3. Convert back to decimal string
  4. Verify result equals "999999.99999"

  ### Expected Results
  - Conversion succeeds without exception
  - Internal representation correct
  - Round-trip conversion maintains precision
  - No loss of significant digits

  ### Postconditions
  - None (pure function, no side effects)
  ```


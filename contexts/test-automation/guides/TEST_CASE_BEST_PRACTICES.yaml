  ## Test Type Distinctions

  ### Performance Assertion Rules

  | Test Level | Performance Assertions? | Focus |
  |------------|------------------------|-------|
  | Unit | ❌ NO | Correctness only |
  | Integration | ❌ NO | Correctness only |
  | E2E API | ❌ NO | Correctness only |
  | E2E UI | ❌ NO | Correctness only |
  | E2E Performance | ✅ YES | User workflow latency |
  | Microbenchmark | ✅ YES | Component latency |
  | Security | ❌ NO | Security only |
  | Compliance | ❌ NO | Compliance only |

  ### Functional Tests

  **Focus**: Correctness of business logic

  **Assertions**:
  - Data accuracy (order details correct)
  - State transitions (NEW → FILLED)
  - Business rule validation (risk checks pass/fail correctly)

  **Example**: Verify order is accepted with status NEW and correct confirmation ID

  ### E2E Performance Tests

  **Focus**: User workflow performance

  **Scenarios**: SAME as E2E functional tests

  **Assertions**:
  - Response times from user perspective (p50, p99, p99.9)
  - Throughput under load (concurrent users)
  - System stability (no errors under load)

  **Example**: Execute "login → place order → verify confirmation" workflow and verify p99 response time < 500ms from user perspective

  ### Microbenchmark Tests

  **Focus**: Component/method performance

  **Scenarios**: Isolated component operations

  **Assertions**:
  - Sub-microsecond latencies
  - CPU cycles
  - Memory allocations (should be zero)

  **Example**: Benchmark risk check validation to ensure p99 < 10 microseconds with zero allocations

  ### Security Tests

  **Focus**: Authentication, authorization, input validation

  **Assertions**:
  - Access control (unauthorized users blocked)
  - Encryption (sensitive data encrypted)
  - Injection prevention (SQL injection, XSS blocked)

  **NO performance assertions**

  ### Compliance Tests

  **Focus**: Regulatory requirements

  **Assertions**:
  - Audit trail completeness (100% of events logged)
  - Timestamp accuracy (±100μs)
  - Regulatory format compliance (MiFID II fields present)

  **NO performance assertions**


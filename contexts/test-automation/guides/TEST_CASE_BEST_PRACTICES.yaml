  ## Naming Conventions

  ### Pattern
  `test_<Feature>_<Scenario>_<ExpectedBehavior>`

  ### Examples by Level

  **Unit Tests**:
  - `test_PriceConversion_NegativeValue_ThrowsException`
  - `test_QuantityValidation_BelowMinimum_ReturnsFalse`
  - `test_MoneyAddition_OverflowCondition_ThrowsException`

  **Integration Tests**:
  - `test_OrderSubmission_DatabasePersistence_SavesAllFields`
  - `test_EventPublishing_OrderCreated_PublishesToStream`
  - `test_SnapshotRecovery_LoadAndReplay_RestoresState`

  **E2E API Tests**:
  - `test_OrderWorkflow_SubmitAndCancel_CompleteLifecycle`
  - `test_PositionUpdate_MultipleOrders_AccurateCalculation`
  - `test_RateLimiting_ExceedLimit_ReturnsThrottleError`

  **E2E UI Tests**:
  - `test_TradingUI_PlaceMarketOrder_DisplaysConfirmation`
  - `test_AccountUI_ViewPositions_ShowsAllOpenPositions`
  - `test_LoginFlow_InvalidCredentials_ShowsErrorMessage`

  **E2E Performance Tests**:
  - `test_TradingWorkflow_PlaceOrder_MeetsLatencySLA`
  - `test_LoginWorkflow_ConcurrentUsers_HandlesLoad`
  - `test_ReportingWorkflow_LargeDataset_MeetsResponseTime`

  **Microbenchmark Tests**:
  - `benchmark_RiskCheck_MarginValidation_SubMicrosecond`
  - `benchmark_MatchingEngine_OrderBookUpdate_SubMicrosecond`
  - `benchmark_PriceCalculation_SpreadComputation_Nanosecond`


  ## Performance Test Patterns

  ### E2E Performance Test Template

  ```markdown
  ## Test Case: TC-PERF-E2E-TRADING-001

  ### Name
  test_TradingWorkflow_PlaceMarketOrder_MeetsLatencySLA

  ### Test Level
  E2E Performance

  ### Scenario
  Complete user workflow: Login → Place market order → Verify confirmation → View position

  ### Priority
  P0 - Critical user path with strict SLA

  ### Preconditions
  - System in production-like state
  - 1000 test users provisioned
  - Market data feeds active
  - Load generators configured

  ### Test Steps
  1. User logs in with valid credentials
  2. User navigates to trading screen
  3. User places market order for EURUSD, quantity 0.1
  4. System displays order confirmation
  5. User views updated position
  6. Repeat workflow with 500 concurrent users for 60 seconds
  7. Measure response time for each step from user perspective
  8. Calculate latency percentiles for complete workflow

  ### Expected Results
  - p50 workflow latency < 200ms (user perspective)
  - p99 workflow latency < 500ms (user perspective)
  - p99.9 workflow latency < 1 second (user perspective)
  - 100% of workflows complete successfully
  - Zero errors or timeouts
  - System remains stable under load
  - CPU utilization < 80% across all services
  - Memory stable (no leaks)

  ### Postconditions
  - All test orders cancelled
  - Test user accounts reset
  - System metrics logged for analysis
  ```

  ### Microbenchmark Test Template

  ```markdown
  ## Test Case: TC-BENCH-RISK-001

  ### Name
  benchmark_RiskCheck_MarginValidation_SubMicrosecond

  ### Test Level
  Microbenchmark

  ### Component
  Risk Service - Margin Sufficiency Check

  ### Priority
  P1 - Critical path component with strict latency requirement

  ### Scenario
  Measure isolated performance of margin validation logic

  ### Preconditions
  - Microbenchmarking framework configured
  - JVM warmed up with 10,000 warmup iterations
  - GC completed before measurement
  - Test data prepared (account balance, positions, order)

  ### Test Steps
  1. Prepare test data: Account balance = $10,000, Open position value = $5,000, New order value = $1,000
  2. Invoke margin check method
  3. Measure execution time
  4. Repeat 1,000,000 times
  5. Calculate statistics: mean, p50, p99, p99.9, p99.99
  6. Verify zero allocations (no garbage generated)

  ### Expected Results
  - Mean execution time < 5 microseconds
  - p99 execution time < 10 microseconds
  - p99.99 execution time < 20 microseconds
  - Zero allocations (no objects created)
  - Deterministic performance (coefficient of variation < 10%)
  - Correct result on every invocation (validation consistency)

  ### Postconditions
  - Benchmark results logged
  - Performance regression check (compare to baseline)
  ```

  ---

  ## Anti-Patterns

  ### What NOT to Do ❌

  1. **Vague test names**: "test_order_submission" → No indication of scenario or expectation
  2. **Skip negative scenarios**: Only testing happy paths leaves error handling untested
  3. **Performance assertions in functional tests**: Mixes concerns, makes tests brittle
  4. **Test components in E2E performance tests**: Use microbenchmarks instead
  5. **Test user workflows in microbenchmarks**: Use E2E performance tests instead
  6. **Use production data**: Security risk, data privacy violations
  7. **Hard-code test data**: Becomes stale, hard to maintain
  8. **Test order dependency**: Test B fails if Test A doesn't run first
  9. **Multiple features in one test**: Hard to debug failures
  10. **Over-mock in integration tests**: Defeats purpose of integration testing
  11. **Skip cleanup**: Leaves system in dirty state for next test
  12. **Mix test levels**: Unit test that hits database is actually integration test

  ### What TO Do ✅

  1. **Encode meaning in names**: `test_OrderSubmission_InsufficientMargin_RejectsWithError`
  2. **Test one scenario per test**: Clear focus, easy to debug
  3. **Separate functional and performance**: Different test suites, different concerns
  4. **E2E performance = user workflows**: Login, trade, report with performance assertions
  5. **Microbenchmarks = components**: Risk check, matching engine with sub-μs assertions
  6. **Use data factories**: Generate fresh, valid test data for each test
  7. **Write isolated tests**: Each test can run independently in any order
  8. **Use containerized dependencies**: Real databases, message queues in integration tests
  9. **Mock only external services**: LPs, third-party APIs, external feeds
  10. **Clean up resources**: Always restore system to clean state
  11. **Keep test levels focused**: Unit = no I/O, Integration = real dependencies, E2E = full stack


  ## Test Design Techniques

  ### Equivalence Partitioning

  Divide input domains into classes where all values should behave similarly.

  **HFT Examples**:

  | Input | Valid Partitions | Invalid Partitions |
  |-------|------------------|-------------------|
  | Order Type | MARKET, LIMIT, STOP, STOP_LIMIT | NULL, empty, "INVALID" |
  | Price | 0.00001-999999.99999 | Negative, zero (for some order types), > max |
  | Quantity | Min lot size to max position | Zero, negative, fractional (if not allowed) |
  | Timestamp | Valid UTC, within business hours | Future dates, invalid format, null |

  **Best Practice**: Select one representative value from each partition for test cases. Add boundary values for comprehensive coverage.

  ### Boundary Value Analysis

  Test at the edges of equivalence partitions where defects commonly occur.

  **Critical Boundaries in HFT**:

  - **Price Boundaries**:
    - Minimum price increment (tick size): 0.00001
    - Maximum price: Asset-specific limits
    - Zero price (usually invalid for most order types)
  - **Quantity Boundaries**:
    - Minimum lot size: 0.01 for crypto, 1000 for forex mini lot
    - Maximum position size: Risk limit boundaries
  - **Latency Thresholds**:
    - p50 < 50μs, p99 < 1ms, p99.9 < 5ms
    - Test at: 49μs, 50μs, 51μs (boundary straddling)
  - **Rate Limits**:
    - Max orders per second: 100
    - Test at: 99, 100, 101 orders/second

  ### Decision Tables

  Map complex business rules with multiple conditions to expected outcomes.

  **Example: Order Acceptance Logic**

  | Margin Sufficient | Position Limit OK | Price Valid | Market Open | Result |
  |-------------------|-------------------|-------------|-------------|--------|
  | Yes | Yes | Yes | Yes | **ACCEPT** |
  | No  | Yes | Yes | Yes | **REJECT: Insufficient Margin** |
  | Yes | No  | Yes | Yes | **REJECT: Position Limit** |
  | Yes | Yes | No  | Yes | **REJECT: Invalid Price** |
  | Yes | Yes | Yes | No  | **REJECT: Market Closed** |

  **Best Practice**: Create one test case per row. Ensure all condition combinations are covered.

  ### State Transition Tables

  Define valid state changes and test transitions exhaustively.

  **Example: Order Lifecycle States**

  ```
  NEW → PARTIALLY_FILLED → FILLED (happy path)
  NEW → CANCELLED (user cancellation)
  NEW → REJECTED (risk check failure)
  NEW → EXPIRED (time-in-force expiry)
  PARTIALLY_FILLED → FILLED (completion)
  PARTIALLY_FILLED → CANCELLED (partial cancel)
  ```

  **Test Coverage**:
  - Valid transitions (all paths above)
  - Invalid transitions (e.g., FILLED → NEW, CANCELLED → FILLED)
  - State-specific actions (can only cancel if NEW or PARTIALLY_FILLED)


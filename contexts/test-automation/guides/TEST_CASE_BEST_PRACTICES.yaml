  ## Risk-Based Prioritization

  ### Priority Matrix

  | Priority | Financial Impact | Regulatory Impact | Likelihood | Examples |
  |----------|-----------------|-------------------|------------|----------|
  | **P0 (Critical)** | High | High | Medium-High | Order execution errors, position miscalculation, audit trail gaps |
  | **P1 (High)** | High | Medium | Medium | Risk check bypasses, price validation failures |
  | **P2 (Medium)** | Medium | Low | Low-Medium | UI display issues, reporting delays |
  | **P3 (Low)** | Low | None | Low | Minor UI inconsistencies, cosmetic issues |

  ### Financial Impact

  - **High**: Direct monetary loss (incorrect execution, risk breach, position errors)
  - **Medium**: Indirect loss (operational delays, manual intervention required)
  - **Low**: No financial impact (cosmetic, convenience features)

  ### Regulatory Impact

  - **High**: MiFID II violations (timestamp errors, audit trail gaps, best execution failures)
  - **Medium**: Reporting delays, incomplete audit trails
  - **Low**: No regulatory impact

  ### Likelihood Assessment

  - **High**: Complex logic, frequent changes, historical defects
  - **Medium**: Moderate complexity, stable code
  - **Low**: Simple logic, well-tested, rare changes

  ### Detection Difficulty

  - **Hard to catch**: Race conditions, timing issues, rare edge cases → Increase priority
  - **Easy to catch**: Obvious errors, deterministic failures → Priority by impact


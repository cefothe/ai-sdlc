  ### Example 5: E2E Performance Test

  ```markdown
  ## Test Case: TC-PERF-E2E-TRADING-001

  ### Name
  test_TradingWorkflow_PlaceMarketOrder_MeetsLatencySLA

  ### Test Level
  E2E Performance

  ### Priority
  P0 - Critical user path with strict SLA

  ### Test Type
  Performance

  ### Interface
  BE-rest, BE-websocket

  ### Scenario
  User workflow: Login → Place market order → Receive confirmation → View updated position

  ### Preconditions
  - System in production-like state (all services running)
  - 500 test users provisioned
  - Load generation tools configured
  - Market data feeds active
  - Baseline system metrics collected

  ### Test Steps
  1. Simulate 500 concurrent users
  2. Each user executes workflow:
     a. Login via REST API
     b. Place market order for EURUSD via REST API
     c. Wait for confirmation via WebSocket
     d. Query position via REST API
  3. Repeat workflow continuously for 300 seconds
  4. Measure end-to-end latency from step 2a to 2d completion
  5. Collect latency for each workflow iteration
  6. Calculate percentiles: p50, p90, p95, p99, p99.9
  7. Monitor system metrics: CPU, memory, network

  ### Expected Results (WITH PERFORMANCE ASSERTIONS)
  - **p50 latency < 200ms** (median user experience)
  - **p99 latency < 500ms** (99% of users)
  - **p99.9 latency < 1 second** (worst case)
  - 100% workflow completion rate (no failures)
  - Zero errors or timeouts
  - System remains stable (no crashes)
  - CPU utilization < 80% across all services
  - Memory usage stable (no leaks)
  - Network bandwidth < 70% capacity

  ### Postconditions
  - All test orders cancelled
  - Test users logged out
  - Performance metrics exported for analysis
  - System metrics logged
  ```

  ### Example 6: Microbenchmark Test

  ```markdown
  ## Test Case: TC-BENCH-RISK-001

  ### Name
  benchmark_RiskCheck_MarginValidation_SubMicrosecond

  ### Test Level
  Microbenchmark

  ### Priority
  P1 - Critical component with strict latency requirement

  ### Test Type
  Performance

  ### Component
  Risk Service - Margin Sufficiency Validation Method

  ### Scenario
  Measure isolated performance of margin calculation and validation logic

  ### Preconditions
  - Microbenchmarking framework initialized
  - JVM configured with -XX:+UseG1GC -Xms2g -Xmx2g
  - Warm-up phase: 10,000 iterations
  - GC forced before measurement phase
  - CPU cores pinned (isolation)

  ### Test Data
  - Account balance: $10,000
  - Open position margin used: $5,000
  - Open position unrealized P&L: -$500
  - New order margin required: $1,000
  - Margin requirement ratio: 0.01 (1%)

  ### Test Steps
  1. Prepare test data (account state, positions, new order)
  2. Execute warm-up iterations (10,000 times)
  3. Force garbage collection
  4. Start measurement
  5. Invoke marginValidation(account, positions, newOrder)
  6. Measure execution time in nanoseconds
  7. Repeat 1,000,000 times
  8. Calculate statistics:
     - Mean, median (p50)
     - p99, p99.9, p99.99
     - Standard deviation, coefficient of variation
  9. Count memory allocations (should be zero)

  ### Expected Results (WITH PERFORMANCE ASSERTIONS)
  - **Mean execution time < 5 microseconds**
  - **p99 execution time < 10 microseconds**
  - **p99.9 execution time < 15 microseconds**
  - **p99.99 execution time < 20 microseconds**
  - **Zero allocations** (no objects created in hot path)
  - **Coefficient of variation < 10%** (deterministic)
  - Correct validation result on every iteration (functional correctness)
  - Result: PASS (sufficient margin for this test case)

  ### Postconditions
  - Benchmark results exported to metrics system
  - Regression check against baseline (alert if >10% slower)
  - Performance report generated
  ```


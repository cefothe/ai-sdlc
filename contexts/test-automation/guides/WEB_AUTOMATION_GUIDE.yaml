  ## Element Base Interface — Full API

  All element types inherit these methods from the `Element` interface:

  ```java
  // Core interactions
  element.click();
  element.doubleClick();
  element.rightClick();
  element.hover();
  element.sendKeys("text");
  element.pressKey("Enter");            // Named keys: "Enter", "Tab", "Escape", "Control+A"
  element.scrollIntoView();
  element.focus();
  element.blur();
  element.dragTo(targetElement);        // Drag and drop

  // Queries
  String text = element.getText();
  String attr = element.getAttribute("href");
  String css = element.getCssValue("color");
  String inner = element.getInnerHtml();
  String outer = element.getOuterHtml();
  boolean visible = element.isDisplayed();
  boolean enabled = element.isEnabled();

  // Waits
  element.waitUntilVisible(Duration.ofSeconds(10));
  element.waitUntilClickable(Duration.ofSeconds(10));
  element.waitUntilHidden(Duration.ofSeconds(5));
  element.waitForText("Expected", Duration.ofSeconds(5));
  element.waitForAttribute("class", "active", Duration.ofSeconds(5));

  // Multiple elements
  List<? extends Element> all = element.all();   // All matching as typed list
  List<Button> buttons = button(css(".btn")).all(); // Narrowed type
  ```

  ## Additional BasePage Methods

  ```java
  // Element queries
  List<Element> items = elements(css(".item"));           // All matching elements
  int count = countElements(css(".notification"));        // Count matches

  // Wait for element presence/absence
  waitForElement(testId("loading-done"), Duration.ofSeconds(10));
  waitForElementAbsent(testId("spinner"), Duration.ofSeconds(10));

  // Dialog handling
  acceptNextDialog();                    // Auto-accept next JS dialog
  dismissNextDialog();                   // Auto-dismiss next JS dialog
  acceptNextDialog("prompt text");       // Accept prompt() with text

  // Frame management (FrameSwitcher interface — see "Iframe handling" below)
  switchToFrame("iframe-name");          // By CSS selector / name / id string
  switchToFrame(testId("content-frame")); // By framework Locator
  switchToParentFrame();                 // Pop one frame level
  switchToDefaultContent();              // Back to main content (clears frame stack)

  // Screenshots
  takeScreenshot(Path.of("screenshot.png"));
  ```

  ## Iframe Handling (FrameSwitcher)

  Iframe switching is defined on the `FrameSwitcher` interface in `com.tradu.core.driver`. `WebDriver` extends `Driver, FrameSwitcher`, and `BasePage` exposes the same four methods directly — so page objects and tests can switch frames without going through `driver()`.

  ```java
  // On BasePage (and therefore any page object):
  switchToFrame(String selectorOrName);  // CSS selector, frame name, or frame id
  switchToFrame(Locator locator);        // Framework Locator (testId, css, xpath, ...)
  switchToParentFrame();                 // Pop one frame level off the internal stack
  switchToDefaultContent();              // Clear the whole stack — back to top-level page
  ```

  **Scoped context** — once a frame is active, the framework automatically scopes to that frame for:
  - Element lookup (`element(...)`, `button(...)`, `textBox(...)`, etc.)
  - JavaScript execution (`JavaScriptExecutor.execute(...)`)
  - Web storage (`LocalStorage` / `SessionStorage`)

  You do not need to pass a frame reference around — just switch in, work, switch out. Nested frames are supported via an internal deque.

  **Nested frame example**:

  ```java
  public final class CheckoutPage extends BasePage {
      private static final Locator PAYMENT_FRAME = testId("payment-iframe");
      private static final Locator THREE_DS_FRAME = css("iframe[title='3D Secure']");
      private static final Locator CARD_NUMBER = id("card-number");
      private static final Locator OTP_INPUT = id("otp");

      public void enterCardAndConfirmOtp(String pan, String otp) {
          switchToFrame(PAYMENT_FRAME);          // enter payment iframe
          textBox(CARD_NUMBER).enterText(pan);
          switchToFrame(THREE_DS_FRAME);         // enter nested 3DS iframe
          textBox(OTP_INPUT).enterText(otp);
          button(id("submit")).click();
          switchToDefaultContent();              // back to main page
      }
  }
  ```

  **Rules**:
  - Always encapsulate frame switching **inside the page object that owns the iframe** — never leak `switchToFrame(...)` calls into test code. Tests call domain methods like `enterCardAndConfirmOtp(...)` and stay unaware of the DOM nesting.
  - Tab switches and `driver().navigateTo(...)` automatically reset the frame stack — no manual `switchToDefaultContent()` needed before navigation.
  - `switchToFrame(String)` accepts blank strings as an error (rejected with a clear message, not silent fallback); backslashes in the string are safely escaped to prevent CSS selector breakout.
  - Prefer the `Locator` overload when the iframe has a `data-testid` — it's typo-safe and consistent with the rest of the page object.
  - Never import `com.microsoft.playwright.Frame` in core/tests — that would leak the adapter type across the hexagonal boundary. If you catch yourself wanting to, you need `switchToFrame(...)` instead.


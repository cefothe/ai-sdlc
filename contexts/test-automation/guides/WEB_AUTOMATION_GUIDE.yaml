  ## Container Execution (Testcontainers)

  **Use the tool-agnostic `DriverContainer` API** from `test-automation-core` — never instantiate `PlaywrightContainer` directly from test code. `DriverContainer.create()` / `DriverContainer.getOrStart()` are SPI-discovered via `DriverContainerProvider`, so tests stay decoupled from the adapter. Switching from Playwright to another adapter becomes a Maven dependency swap with zero test code changes.

  ```java
  import com.tradu.core.driver.DriverContainer;

  // Create and configure — no Playwright-specific imports needed
  DriverContainer<?> container = DriverContainer.create()
      .withBrowser(Browser.FIREFOX)
      .withTestFileFromClasspath("/test-page.html", "test-page.html");
  container.start();

  // Connect with matching browser
  DriverConfig config = DriverConfig.builder()
      .browser(Browser.FIREFOX)
      .executionMode(ExecutionMode.CONTAINER)
      .wsEndpoint(container.getWsEndpoint())
      .build();
  WebDriver driver = DriverManager.initializeDriver(config);
  ```

  ### Extra exposed ports

  `DriverContainer.withAdditionalExposedPorts(int...)` exposes extra container ports **without** replacing framework defaults (browser WS on 3000, file server on 8080). Useful when the containerized browser needs to reach a sidecar service launched inside the same container, or when debug tooling needs a port mapped back to the host.

  ```java
  DriverContainer<?> container = DriverContainer.create()
      .withBrowser(Browser.CHROME)
      .withAdditionalExposedPorts(9222, 9000)   // debug + metrics endpoints
      .withTestFileFromClasspath("/test-page.html", "test-page.html");
  container.start();

  int debugHostPort = container.getMappedPort(9222);
  ```

  ### Shared container across test classes (SharedContainerFixture)

  `DriverContainer.getOrStart()` returns a process-wide singleton with a JVM shutdown hook — one-time startup, reused across every test class that touches it. Replaces the per-class `@Container` field pattern and cuts container startup from N-per-class to 1-per-process.

  `getOrStart(UnaryOperator<DriverContainer<?>> configurator)` applies one-time configuration on the **first** call (browser choice, extra ports, mounted test files). Subsequent calls return the existing singleton and ignore their configurator argument.

  ```java
  // src/test/java/.../SharedContainerFixture.java
  public final class SharedContainerFixture {
      private SharedContainerFixture() {}

      public static DriverContainer<?> get() {
          return DriverContainer.getOrStart(c -> c
              .withBrowser(Browser.valueOf(
                  ConfigurationManager.getProperty("browser", "CHROME").toUpperCase()))
              .withTestFileFromClasspath("/fixtures/test-page.html", "test-page.html"));
      }
  }

  // In any test class — no per-class @Container field, no manual start/stop
  class OrderFlowContainerTest extends BaseWebTest {
      @BeforeAll
      static void setUp() {
          DriverContainer<?> container = SharedContainerFixture.get();
          DriverManager.initializeDriver(DriverConfig.builder()
              .browser(Browser.CHROME)
              .executionMode(ExecutionMode.CONTAINER)
              .wsEndpoint(container.getWsEndpoint())
              .build());
      }
  }
  ```

  Docker image build: `docker build -t playwright-server:${PW_VERSION} test-automation-web-playwright/src/main/resources/docker/`
  Runtime: `mvn test -Dexecution.mode=CONTAINER`

  ## @WebTest Annotation

  Metadata-only annotation on test methods — NOT auto-processed by any JUnit extension. Tests must manually init drivers via `DriverManager.initializeDriver()`.

  ```java
  @Test
  @WebTest(browser = Browser.CHROME, mode = ExecutionMode.LOCAL, headless = true)
  void testFeature() {
      // @WebTest is metadata — driver init is manual
      DriverManager.initializeDriver(DriverConfig.builder()
          .browser(Browser.CHROME).headless(true).build());
      // ... test code ...
  }
  ```


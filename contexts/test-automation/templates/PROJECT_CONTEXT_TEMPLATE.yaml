  # Project Test Context Template
  
  > **Instructions**: Copy this file to your project's `.claude/` directory and fill in project-specific details.
  
  ```bash
  cp ~/.claude/contexts/test-automation/templates/PROJECT_CONTEXT_TEMPLATE.yaml \
     your-project/.claude/PROJECT_TEST_CONTEXT.yaml
  ```
  
  Then customize the file with your project's specific information.
  
  ---
  

  ### Page Object Patterns
  
  **Page Object Pattern** (zero-arg constructor, inline element calls):
  ```java
  public final class MyPage extends BasePage {
      private static final Locator MY_BUTTON = id("element-id");

      public void clickMyButton() {
          button(MY_BUTTON).click();
      }
  }
  ```
  
  **Navigation Methods**:
  ```java
  public DashboardPage navigateToDashboard() {
      logger.info("Navigating to dashboard");
      getDriver().navigateTo("https://example.com/dashboard");
      return new DashboardPage();
  }
  ```
  

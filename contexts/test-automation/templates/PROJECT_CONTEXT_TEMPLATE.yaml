  ### Frontend Component Paths

  Used by UI test automation to locate components for adding `data-testid` attributes:

  ```yaml
  frontend_component_paths:
    - apps/web/dashboard/src/components/    # {Description}
    - apps/web/admin/src/components/        # {Description}
    - libs/web/ui-components/src/components/ # Shared UI library
  ```

  ## Test Environments
  
  ### Development
  
  ```properties
  # Base URLs
  api.base.url=http://localhost:8080
  web.base.url=http://localhost:3000
  
  # Database
  db.url=jdbc:postgresql://localhost:5432/dev_db
  db.username=dev_user
  db.password=${DEV_DB_PASSWORD}
  
  # Special considerations
  # - Local data is reset daily at midnight
  # - Mock services available for third-party integrations
  ```
  
  ### Staging
  
  ```properties
  # Base URLs
  api.base.url=https://staging-api.example.com
  web.base.url=https://staging.example.com
  
  # Database (read-only for tests)
  db.url=jdbc:postgresql://staging-db.example.com:5432/staging_db
  db.username=${STAGING_DB_USER}
  db.password=${STAGING_DB_PASSWORD}
  
  # Special considerations
  # - Data refreshed from production weekly (Sundays 2 AM UTC)
  # - Third-party integrations use sandbox environments
  # - Rate limits: 100 requests/minute per API key
  ```
  
  ### Production
  
  ```properties
  # Base URLs
  api.base.url=https://api.example.com
  web.base.url=https://example.com
  
  # Database (read-only for tests)
  db.url=jdbc:postgresql://prod-db.example.com:5432/prod_db
  db.username=${PROD_DB_USER}
  db.password=${PROD_DB_PASSWORD}
  
  # Special considerations
  # - Tests run in isolated test tenant
  # - Real money NOT used (test tenant has unlimited virtual balance)
  # - Rate limits: 1000 requests/minute per API key
  # - Tests run during off-peak hours only (2 AM - 6 AM UTC)
  ```
  
  ## Test Users
  
  ### User Roles
  
  **Admin User**:
  ```
  Username: test_admin@example.com
  Password: ${TEST_ADMIN_PASSWORD}
  Permissions: Full system access
  Used for: Admin panel tests, user management tests
  ```
  
  **Trader User**:
  ```
  Username: test_trader@example.com
  Password: ${TEST_TRADER_PASSWORD}
  Permissions: Trading, view positions, view account
  Account Balance: $100,000 (virtual)
  Used for: Trading flow tests, order management tests
  ```
  
  **Read-Only User**:
  ```
  Username: test_viewer@example.com
  Password: ${TEST_VIEWER_PASSWORD}
  Permissions: View-only access
  Used for: Dashboard tests, reporting tests
  ```
  
  ### User Management
  
  **User Caching** (via UserCache — Redis-backed, 24h TTL):
  ```java
  // Get or create cached test user
  User trader = UserCache.getOrCreateUser("trader");

  // Use in test
  loginPage.login(trader.username(), trader.password());

  // Store a specific user for reuse
  UserCache.storeUser("admin", new User("admin_user", "Admin@123", "admin@test.com", "admin"));
  ```
  
  **Creating Test Users**:
  ```java
  // Via API
  ApiResponse response = UserService.createUser(new CreateUserRequest(
      "test_user_" + System.currentTimeMillis() + "@example.com",
      "Test@1234",
      UserRole.TRADER
  ));
  ```
  
  ## Domain Knowledge
  
  ### Business Rules
  
  **Order Validation**:
  - Minimum order size: 10,000 units for forex
  - Maximum order size: 10,000,000 units for forex
  - Symbol format: {BASE}{QUOTE} (e.g., EURUSD, GBPJPY)
  - Price precision: 5 decimals for JPY pairs, 6 for others
  
  **Account Rules**:
  - Minimum account balance: $1,000
  - Maximum leverage: 1:100
  - Margin requirement: 1% for major pairs, 2% for minors
  
  **Trading Hours**:
  - Forex: Sunday 10:00 PM - Friday 10:00 PM UTC (24/5)
  - Stocks: Exchange-specific (NYSE: 2:30 PM - 9:00 PM UTC)
  - Market closed: No new orders, only amendments/cancellations
  
  ### Terminology
  
  | Term | Meaning | Example |
  |------|---------|---------|
  | **Pip** | Price point (0.0001 for most pairs) | EURUSD moves from 1.0850 to 1.0851 = 1 pip |
  | **Lot** | Standard trading unit (100,000 units) | 1 lot EURUSD = 100,000 EUR |
  | **Spread** | Difference between bid and ask | Bid: 1.0850, Ask: 1.0852 = 2 pip spread |
  | **Margin** | Required collateral for position | $1,000 margin for 1 lot EURUSD at 1:100 leverage |
  | **P&L** | Profit and Loss | Current position value vs entry value |
  
  ### Data Formats
  
  **Symbols**:
  ```
  Format: {BASE}{QUOTE}
  Examples: EURUSD, GBPJPY, AAPL, BTC/USD
  Validation: /^[A-Z]{6}$/  (for forex)
  ```
  
  **Prices**:
  ```
  Format: Decimal with precision based on instrument
  EURUSD: 1.085000 (6 decimals)
  USDJPY: 110.500 (3 decimals)
  AAPL: 150.25 (2 decimals)
  ```
  
  **Quantities**:
  ```
  Format: Integer (in base units)
  1 lot forex = 100,000 units
  1 share = 1 unit
  Min: 10,000 (forex), 1 (stocks)
  ```
  
  ## Page Objects
  
  ### Implemented Page Objects
  

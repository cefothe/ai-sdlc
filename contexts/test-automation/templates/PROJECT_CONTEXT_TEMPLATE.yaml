  ### Service Class Patterns
  
  **Basic Service**:
  ```java
  public final class MyService extends ApiGatewayService {
      private MyService() {}
  
      public static ApiResponse myOperation(String authToken, MyRequest request) {
          Allure.step("POST /api/my-operation - Description");
          logger.info("Performing operation: {}", request);

          return post("/api/my-operation")
              .bearerAuth(authToken)
              .contentType("application/json")
              .body(request)
              .timeout(Duration.ofSeconds(30))
              .send();
      }
  }
  ```
  
  ## Test Data Patterns
  
  ### Test Data Models
  
  **Location**: `src/main/java/com/example/models/`
  
  **CreateOrderRequest**:
  ```java
  public record CreateOrderRequest(
      String symbol,
      OrderSide side,
      int quantity,
      double price,
      OrderType orderType,
      TimeInForce timeInForce
  ) {
      public static CreateOrderRequest marketOrder(String symbol, OrderSide side, int quantity) {
          return new CreateOrderRequest(symbol, side, quantity, 0.0, OrderType.MARKET, TimeInForce.IOC);
      }
  
      public static CreateOrderRequest limitOrder(String symbol, OrderSide side, int quantity, double price) {
          return new CreateOrderRequest(symbol, side, quantity, price, OrderType.LIMIT, TimeInForce.DAY);
      }
  }
  ```
  
  **OrderResponse**:
  ```java
  public record OrderResponse(
      String id,
      String symbol,
      OrderSide side,
      int quantity,
      double price,
      String status,
      long timestamp
  ) {}
  ```
  
  ### Test Data Builders
  
  **Order Builder**:
  ```java
  public class OrderTestData {
      public static CreateOrderRequest defaultLimitOrder() {
          return CreateOrderRequest.limitOrder("EURUSD", OrderSide.BUY, 100000, 1.0850);
      }
  
      public static CreateOrderRequest largeOrder() {
          return CreateOrderRequest.limitOrder("EURUSD", OrderSide.BUY, 10000000, 1.0850);
      }
  
      public static CreateOrderRequest invalidSymbol() {
          return CreateOrderRequest.limitOrder("INVALID", OrderSide.BUY, 100000, 1.0850);
      }
  }
  ```
  
  ## Project-Specific Rules
  
  ### Test Isolation
  
  - **Each test creates its own data** - Never depend on data from other tests
  - **Clean up after tests** - Delete created orders, users, accounts
  - **Use unique identifiers** - Timestamp-based or UUID for test data
  - **Avoid shared state** - No global test data or shared resources
  
  ### Parallel Execution
  
  - **Thread-safe tests** - Use ThreadLocal drivers, unique test data
  - **Independent tests** - No dependencies between tests
  - **Resource limits** - Max 4 parallel threads (API rate limits)
  
  ### Test Organization
  
  ```
  src/test/java/com/example/tests/
  ├── api/
  │   ├── OrderApiTest.java
  │   ├── AccountApiTest.java
  │   └── UserApiTest.java
  ├── ui/
  │   ├── LoginTest.java
  │   ├── DashboardTest.java
  │   └── TradingTest.java
  └── e2e/
      └── TradingWorkflowTest.java
  ```
  
  ### Naming Conventions
  
  **Test Classes**: `{Feature}Test.java` (e.g., `OrderCreationTest.java`)
  **Test Methods**: `test{Scenario}` (e.g., `testCreateLimitOrder`)
  **Page Objects**: `{Page}Page.java` (e.g., `LoginPage.java`)
  **Services**: `{Entity}Service.java` (e.g., `OrderService.java`)
  
  ## Known Issues
  
  ### Flaky Tests
  
  **Dashboard Load Timeout** (`DashboardTest.testLoadDashboard`):
  - **Issue**: Intermittent timeout when loading dashboard after login
  - **Workaround**: Add explicit wait for dashboard header element
  - **Ticket**: PROJ-456
  
  **Market Data Delay** (`TradingTest.testPriceUpdate`):
  - **Issue**: Market data can lag by 1-2 seconds in staging
  - **Workaround**: Use polling with 5-second timeout instead of 2 seconds
  - **Ticket**: PROJ-789
  
  ### Environment-Specific Issues
  
  **Staging Database Lag**:
  - **Issue**: Replica database in staging has 5-10 second lag
  - **Impact**: Tests that verify data immediately after creation may fail
  - **Workaround**: Add 10-second wait after data modification operations
  
  **Production Rate Limits**:
  - **Issue**: API rate limited to 1000 req/min
  - **Impact**: Large test suites may hit rate limits
  - **Workaround**: Run tests in smaller batches, use delays between batches
  
  ### Browser-Specific Issues
  
  **Firefox Video Recording**:
  - **Issue**: Video recording sometimes fails on Firefox
  - **Workaround**: Use Chromium for CI/CD pipelines
  - **Ticket**: FRAMEWORK-123
  

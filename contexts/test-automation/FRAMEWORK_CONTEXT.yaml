  ## Quick Start
  
  ### 1. Maven Dependency
  
  ```xml
  <dependency>
      <groupId>com.tradu</groupId>
      <artifactId>tradu-test-automation-framework</artifactId>
      <version>1.0.0</version>
      <scope>test</scope>
  </dependency>
  ```
  
  ### 2. Configuration
  
  Create `src/test/resources/application-dev.properties`:
  ```properties
  api.base.url=https://dev-api.example.com
  browser.headless=false
  xray.enabled=true
  xray.projectKey=PROJ
  ```
  
  ### 3. Write Tests
  
  **API Test**:
  ```java
  @Test
  void test_order_createLimitOrder_returns201() {
      CreateOrderRequest request = CreateOrderRequest.limitOrder(
          "EURUSD", OrderSide.BUY, 100000, 1.0850
      );

      ApiResponse response = OrderService.createOrder(traderToken, request);

      assertThat(response.statusCode()).isEqualTo(201);
      OrderResponse order = response.as(OrderResponse.class);
      assertThat(order.symbol()).isEqualTo("EURUSD");
  }
  ```

  **UI Test**:
  ```java
  @Test
  @WebTest
  void test_order_displayInUI_showsCorrectDetails() {
      // Setup via service (fast)
      ApiResponse response = OrderService.createOrder(traderToken, request);
      OrderResponse order = response.as(OrderResponse.class);

      // Verify UI
      OrderPage page = new OrderPage();
      page.navigateToOrder(order.id());
      assertThat(page.getDisplayedSymbol()).isEqualTo("EURUSD");
  }
  ```
  
  ### 4. Run Tests
  
  ```bash
  # All tests
  mvn clean test
  
  # Specific test
  mvn test -Dtest=OrderApiTest
  
  # Parallel (4 threads)
  mvn test -Dparallel=all -DthreadCount=4
  
  # Generate report
  mvn allure:serve
  ```
  
  ## Best Practices Summary
  
  1. **Always use service classes** - NEVER call HTTP methods (`post`/`get`/etc.) directly in tests
  2. **Service classes are simple** - Just make request and return ApiResponse
  3. **No try-catch in services** - Let exceptions propagate
  4. **No conditionals in services** - Just return the response
  5. **Use services for UI setup** - 15x faster than UI navigation
  6. **Use AssertJ for assertions** - `assertThat(response.statusCode()).isEqualTo(201)`
  7. **Use as() for single objects** - `response.as(OrderResponse.class)`
  8. **Use asList() for collections** - `response.asList(OrderResponse.class)`
  9. **Prefer interfaces over implementations** - WebDriver, not PlaywrightWebDriver
  10. **Use appropriate locators** - testId > id > css > xpath
  11. **Page Objects immutable** - Static final locators
  12. **Service classes stateless** - Static methods only
  13. **Use records for test data** - Immutable
  14. **Explicit waits over sleeps** - element.waitUntilClickable(Duration)
  15. **Parallel-safe design** - ThreadLocal drivers, unique test data

  ## Playwright MCP Integration (Development Only)

  The Playwright MCP provides browser automation for AI-assisted development:

  ### Available When Developing Tests
  - `browser_navigate` - Open URLs
  - `browser_snapshot` - Get element tree (discover locators)
  - `browser_take_screenshot` - Capture states
  - `browser_click`, `browser_fill_form` - Interact with elements

  ### MCP Usage Rules
  1. **Use MCP to explore** - Discover elements, validate flows
  2. **Use Framework to implement** - All test code uses framework interfaces
  3. **Never mix** - MCP for development, Framework for execution

  ### Monorepo Workflow: Adding Missing data-testid
  When MCP snapshot shows elements without data-testid:
  1. Locate frontend component in `apps/web/{feature}/src/components/`
  2. Add `data-testid="feature-element-type"` attribute
  3. Verify with `browser_snapshot`
  4. Implement test with `testId()`

  ### Example Development Flow
  ```
  # MCP: Explore
  browser_navigate -> browser_snapshot -> identify locators

  # If missing data-testid:
  Add to frontend code (monorepo) -> verify with browser_snapshot

  # Framework: Implement
  testId("discovered-id") -> Page Object -> Test
  ```

  See: `guides/MCP_USAGE_GUIDE.yaml` for complete reference.

